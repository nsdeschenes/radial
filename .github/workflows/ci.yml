name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: nub install --frozen-lockfile

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Check formatting
        run: nub run fmt:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Lint
        run: nub run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Typecheck
        run: nub run typecheck

  acceptance:
    name: Deterministic acceptance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run acceptance tooling evidence
        run: nub run test:acceptance

  test:
    name: Deterministic test suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run complete deterministic test suite
        run: nub run test:non-acceptance --shard=${{ matrix.shard }}/4
