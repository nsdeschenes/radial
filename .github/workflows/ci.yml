name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Check formatting
        run: nub run fmt:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Lint
        run: nub run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Typecheck
        run: nub run typecheck

  test:
    name: Deterministic acceptance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Run acceptance tooling evidence
        run: nub run test:acceptance

      - name: Run complete deterministic test suite
        run: nub run test

  coverage:
    name: Diagnostic coverage (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Report percentage coverage without an acceptance threshold
        run: nub run test:coverage --shard=${{ matrix.shard }}/4
